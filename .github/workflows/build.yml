name: build

on:
  push:
    branches: ["arena/4bb8ee31-bring-to-life"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and test
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --console=plain 2>&1 | tee build.log > /dev/null
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > errors.txt
          import os
          import re

          if not os.path.exists('build.log'):
              print('build.log missing: gradle did not run')
              raise SystemExit(0)

          lines = open('build.log', errors='replace').read().splitlines()
          keep = []
          pattern = re.compile(r'error:|What went wrong|Could not resolve|Caused by:|FAILED|symbol:|location:')
          for index, line in enumerate(lines):
              if re.search(r'error:|What went wrong|Could not resolve|Caused by:', line):
                  keep.extend(lines[index:index + 8])
                  keep.append('----')
          print('\n'.join(keep[:200]))
          PY
          test -s errors.txt || echo "no error lines captured" > errors.txt
          sed '/^$/d' errors.txt | head -40 | while IFS= read -r line; do
            echo "::error title=gradle::$line"
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(printf 'CI build failed:\n\n%s' "$(head -c 6000 errors.txt)")" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
