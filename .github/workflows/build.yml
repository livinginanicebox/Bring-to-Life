name: build

on:
  push:
    branches: ["arena/4bb8ee31-bring-to-life"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and test
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --console=plain 2>&1 | tee build.log > /dev/null
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > errors.txt
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          for path in sorted(glob.glob('build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = (failure.get('message') or '').strip().replace('\n', ' ')
                      print('TEST %s.%s' % (case.get('classname'), case.get('name')))
                      print('     %s' % (message[:300] or '(no message)'))
                      clean = [line for line in (failure.text or '').splitlines()
                               if line.strip() and not line.strip().startswith('at ')]
                      for line in clean[:6]:
                          print('     %s' % line.strip()[:200])
                      print('----')

          if not os.path.exists('build.log'):
              print('build.log missing: gradle did not run')
              raise SystemExit(0)

          lines = open('build.log', errors='replace').read().splitlines()
          keep = []
          for index, line in enumerate(lines):
              if re.search(r'error:|What went wrong|Could not resolve|Caused by:', line):
                  block = [l for l in lines[index:index + 8] if not l.strip().startswith('at ')]
                  keep.extend(block)
                  keep.append('----')
          print('\n'.join(keep[:60]))
          PY
          test -s errors.txt || echo "no failure detail captured" > errors.txt
          grep -v '^$' errors.txt | head -50 | while IFS= read -r line; do
            echo "::error title=gradle::$line"
          done
          python3 -c "import json;print(json.dumps({'body':open('errors.txt').read()[:6000]}))" \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input - || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
